name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch at a time; a newer push cancels whatever was already
# building for the same ref, so CI capacity is not spent on a commit nobody
# will look at once its successor has already landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Surefire's default include pattern is **/*Test.java: plain JUnit, no
      # Quarkus context, no database. This is the fast feedback step — it
      # fails in seconds if it is going to fail at all, before the slower
      # integration stage below even starts.
      - name: Unit tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      # Failsafe's default include pattern is **/*IT.java: @QuarkusTest
      # classes that boot the whole application and talk to a real Postgres,
      # started on demand by Quarkus Dev Services against the Docker daemon
      # GitHub's ubuntu runners already ship — nothing extra to install.
      # `verify` also packages the application; a build that compiles but
      # cannot be packaged is exactly the kind of failure this step exists to
      # catch before it reaches Render.
      - name: Integration tests and package
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14
