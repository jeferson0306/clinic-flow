name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Dev Services (Testcontainers) needs Docker for a real Postgres in the
      # test run — GitHub's ubuntu runners ship it, so nothing extra to start.
      - name: Build and test
        run: ./mvnw -B verify
