# LocalStack only — Postgres does not need this file, Quarkus Dev Services
# provisions a real one automatically in %dev/%test (see AGENTS.md). AWS has
# no equivalent Dev Services integration wired up here (see AwsClients'
# javadoc), so LocalStack is started explicitly instead:
#
#   docker compose up -d
#   cd infra/terraform && terraform init && terraform apply
#   ./mvnw quarkus:dev
#
# clinic.aws.enabled defaults on in %dev (application.properties), pointing
# at this container's default port.
services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sns,sqs
      DEFAULT_REGION: us-east-1
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  localstack-data:
