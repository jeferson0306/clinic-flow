quarkus.application.name=clinic-flow

# Dev/test: Quarkus Dev Services boots a real Postgres in a container
# automatically when no datasource is configured — no docker-compose file to
# keep in sync with the schema, and no "works on my machine because I forgot
# to start Postgres" failure mode.
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true

# Production: Neon, over TLS, via env vars — nothing production-shaped is
# ever committed. sslmode=require is not optional: Neon terminates TLS at the
# edge and a plaintext connection is refused there anyway, but stating it here
# means a misconfigured client fails loudly instead of silently downgrading.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}?sslmode=require
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}
%prod.quarkus.flyway.migrate-at-start=true

quarkus.rest-client.brdoc.url=${BRDOC_API_URL:https://api-data-validator.onrender.com}
quarkus.rest-client.brdoc.connect-timeout=3000
quarkus.rest-client.brdoc.read-timeout=5000
# The REST Client spec mandates a default exception mapper that throws on any
# status >= 400 — even when the method's return type is the raw Response,
# where the whole point is to let the caller decide. This is the one thing
# that actually turns it off; https://github.com/quarkusio/quarkus/discussions/47556
# confirms the Response return type alone does not.
quarkus.rest-client."brdoc".disable-default-mapper=true

quarkus.rest-client.viacep.url=${VIACEP_API_URL:https://viacep.com.br/ws}
# Short timeouts on purpose: a postcode lookup is a courtesy — see
# AddressLookupService — and it must fail fast enough that a slow third party
# does not make patient registration feel broken.
quarkus.rest-client.viacep.connect-timeout=2000
quarkus.rest-client.viacep.read-timeout=3000

# Structured logs, matching brdoc: route, status, duration — never a document
# value (GlobalExceptionMapper follows the same rule for errors). JSON console
# output needs the quarkus-logging-json extension, which is a Phase 6
# (observability) addition, not this slice — added when that phase lands.

quarkus.smallrye-openapi.info-title=clinic-flow API
quarkus.smallrye-openapi.info-version=0.1.0
