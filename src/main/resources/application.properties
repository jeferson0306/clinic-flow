quarkus.application.name=clinic-flow

# Dev/test: Quarkus Dev Services boots a real Postgres in a container
# automatically when no datasource is configured — no docker-compose file to
# keep in sync with the schema, and no "works on my machine because I forgot
# to start Postgres" failure mode.
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true

# Production: Neon, over TLS, via one env var — nothing production-shaped is
# ever committed. DATABASE_URL is the exact connection string Neon's own
# dashboard gives you, with its "postgresql://" swapped for "jdbc:postgresql://"
# — credentials and sslmode=require already live inside it, so nothing here
# reconstructs or appends to it. Neon terminates TLS at the edge and refuses a
# plaintext connection anyway; sslmode=require in the URL means a misconfigured
# client fails loudly instead of silently attempting one.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
%prod.quarkus.flyway.migrate-at-start=true

# Render fronts every service with Cloudflare — confirmed the same way for
# brdoc, which needs the identical setting. A fact about the deployment
# platform, not a secret or a per-environment value, so it is a hard default
# here rather than a Render env var someone has to remember to set — see
# ClientAddressResolver for what this actually changes: the address
# RateLimitFilter throttles by and GlobalExceptionMapper logs.
%prod.trusted-platform=cloudflare

quarkus.rest-client.brdoc.url=${BRDOC_API_URL:https://api-data-validator.onrender.com}
# 20s, not 5: brdoc runs on Render's free tier and sleeps after 15 minutes
# idle, same as this service will. A cold start there was measured taking
# longer than a short timeout tolerates — caught by registering a doctor
# against the real service after this file's own dev session had gone idle
# long enough for brdoc to sleep, which 5s turned into a 500 instead of a
# slow-but-successful 201.
quarkus.rest-client.brdoc.connect-timeout=5000
quarkus.rest-client.brdoc.read-timeout=20000
# The REST Client spec mandates a default exception mapper that throws on any
# status >= 400 — even when the method's return type is the raw Response,
# where the whole point is to let the caller decide. This is the one thing
# that actually turns it off; https://github.com/quarkusio/quarkus/discussions/47556
# confirms the Response return type alone does not.
quarkus.rest-client."brdoc".disable-default-mapper=true

quarkus.rest-client.viacep.url=${VIACEP_API_URL:https://viacep.com.br/ws}
# Short timeouts on purpose: a postcode lookup is a courtesy — see
# AddressLookupService — and it must fail fast enough that a slow third party
# does not make patient registration feel broken.
quarkus.rest-client.viacep.connect-timeout=2000
quarkus.rest-client.viacep.read-timeout=3000

# Structured logs, matching brdoc: route, status, duration — never a document
# value (GlobalExceptionMapper follows the same rule for errors). JSON console
# output needs the quarkus-logging-json extension — a later addition, not
# this one.

# Every log line carries the OpenTelemetry trace id of the request that
# produced it, and TraceIdResponseFilter echoes the same id back as
# X-Trace-Id — one identifier ties a request, its response, and every log
# line it produced together, without a hand-rolled request-id filter
# duplicating what tracing already provides.
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n

# No collector deployed yet (that is Phase 6's job) — spans are still created
# and their ids still reach the logs above regardless of where, if anywhere,
# they are exported to. Dev Services would otherwise pull a full Grafana LGTM
# stack (Loki/Grafana/Tempo/Mimir, several hundred MB) on every `quarkus:dev`
# just because the extension is on the classpath — disabled until there is
# somewhere real to send spans to. Dev Services itself is not part of the
# packaged production artifact, so this is scoped to %dev/%test — set
# unconditionally, Quarkus warns at prod startup about an unrecognised key.
quarkus.otel.traces.exporter=none
%dev.quarkus.observability.enabled=false
%test.quarkus.observability.enabled=false

quarkus.smallrye-openapi.info-title=clinic-flow API
quarkus.smallrye-openapi.info-version=0.1.0

# RateLimitFilter throttles per client address, and every @QuarkusTest across
# the whole `mvn verify` run shares one JVM and therefore one address
# (loopback) — dozens of unrelated test methods would otherwise draw against
# the same bucket the way dozens of real callers behind one NAT would. That
# is exactly the scenario the limit exists to catch in production; it is
# noise here. Set high enough in %test that the whole IT suite never has a
# reason to notice it exists.
%test.clinic.rate-limit.requests-per-second=1000
%test.clinic.rate-limit.burst=1000

# JWT: the public key is committed (it is meant to be shared — that is the
# whole point of asymmetric signing), the same key everywhere. The private
# key is not: %dev/%test use a throwaway keypair bundled purely for
# convenience (both halves committed, clearly not the same keypair as
# production's), while %prod points at a Render Secret File — a mounted
# path, not an env var, because a multi-line PEM in a single-line env var is
# an unnecessary way to make this harder to get right.
mp.jwt.verify.issuer=https://clinic-flow
mp.jwt.verify.publickey.location=jwt/publicKey.pem
%dev.smallrye.jwt.sign.key.location=jwt/dev-privateKey.pem
%dev.mp.jwt.verify.publickey.location=jwt/dev-publicKey.pem
%test.smallrye.jwt.sign.key.location=jwt/dev-privateKey.pem
%test.mp.jwt.verify.publickey.location=jwt/dev-publicKey.pem
%prod.smallrye.jwt.sign.key.location=file:/etc/secrets/jwt-private-key.pem
