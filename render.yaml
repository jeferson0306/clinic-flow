# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-click setup: Render dashboard > New > Blueprint > point at this repo.
# Only DATABASE_URL needs to be typed in by hand (sync: false) — Neon's own
# connection string, with "postgresql://" swapped for "jdbc:postgresql://".
services:
  - type: web
    name: clinic-flow
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /q/health
    envVars:
      - key: QUARKUS_PROFILE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: BRDOC_API_URL
        value: https://api-data-validator.onrender.com
