# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-click setup: Render dashboard > New > Blueprint > point at this repo.
# Two things need typing in by hand, neither is a Blueprint field:
#   - DATABASE_URL (envVars below, sync: false): NOT simply Neon's own
#     connection string with "postgresql://" swapped for
#     "jdbc:postgresql://" — pgjdbc does not accept the
#     "user:password@host" credentials-in-the-authority syntax libpq/psql
#     URLs use (confirmed against a real failed deploy: Flyway's own error
#     buries "Unable to parse URL" under a message that reads like a
#     network problem). Move credentials to query parameters instead — see
#     application.properties' own comment on this property for the exact
#     shape. Render prompts for sync: false values during the initial
#     Blueprint creation flow only.
#   - The JWT signing key: there is no "secretFiles" field in the Blueprint
#     spec — confirmed against Render's own docs after a Blueprint apply
#     failed with one present. Add it after the service exists, by hand,
#     under Settings -> Secret Files, at the exact path
#     %prod.smallrye.jwt.sign.key.location names in application.properties.
services:
  - type: web
    name: clinic-flow
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /q/health
    envVars:
      - key: QUARKUS_PROFILE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: BRDOC_API_URL
        value: https://api-data-validator.onrender.com
