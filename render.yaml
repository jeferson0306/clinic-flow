# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-click setup: Render dashboard > New > Blueprint > point at this repo.
# Two things need typing in by hand, neither is a Blueprint field:
#   - DATABASE_URL (envVars below, sync: false): Neon's own connection
#     string, "postgresql://" swapped for "jdbc:postgresql://". Render
#     prompts for sync: false values during the initial Blueprint creation
#     flow only.
#   - The JWT signing key: there is no "secretFiles" field in the Blueprint
#     spec — confirmed against Render's own docs after a Blueprint apply
#     failed with one present. Add it after the service exists, by hand,
#     under Settings -> Secret Files, at the exact path
#     %prod.smallrye.jwt.sign.key.location names in application.properties.
services:
  - type: web
    name: clinic-flow
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /q/health
    envVars:
      - key: QUARKUS_PROFILE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: BRDOC_API_URL
        value: https://api-data-validator.onrender.com
